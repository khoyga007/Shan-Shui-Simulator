<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InkDragon — phòng test</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; user-select: none; }
    #dragon-canvas { display: block; width: 100%; height: 100%; }
    #ov { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #panel { position: fixed; top: 10px; right: 10px; width: 270px; max-height: calc(100% - 20px); overflow: auto; box-sizing: border-box;
      padding: 10px 12px; background: rgba(250, 250, 250, .94); border: 1px solid #bbb; border-radius: 6px;
      font: 12px/1.45 Consolas, 'Cascadia Mono', monospace; color: #222; }
    #panel h3 { margin: 10px 0 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #777; font-weight: 600; }
    #panel h3:first-child { margin-top: 0; }
    #panel label { display: block; }
    #panel .row { display: grid; grid-template-columns: 1fr 52px; gap: 6px; align-items: center; }
    #panel .row b { text-align: right; font-weight: 600; }
    #panel input[type=range] { width: 100%; margin: 0 0 4px; }
    #panel button { font: inherit; padding: 3px 7px; margin: 2px 2px 2px 0; border: 1px solid #999; border-radius: 4px; background: #fff; cursor: pointer; }
    #panel button.on { background: #222; color: #fff; border-color: #222; }
    #panel .keys { color: #666; white-space: pre-wrap; }
    #hint, #toast { position: fixed; left: 50%; transform: translateX(-50%); padding: 7px 14px; border-radius: 5px;
      font: 13px/1.4 Consolas, monospace; background: rgba(20, 20, 20, .86); color: #fff; pointer-events: none; }
    #hint { bottom: 18px; }
    #toast { top: 18px; opacity: 0; transition: opacity .25s; }
    #toast.show { opacity: 1; }
    .hide { display: none !important; }
  </style>
</head>
<body>
  <canvas id="dragon-canvas"></canvas>
  <canvas id="ov"></canvas>
  <div id="panel"></div>
  <div id="hint">Bấm vào màn hình để cầm đầu rồng · Esc để thả chuột</div>
  <div id="toast"></div>
  <script src="dragon.js"></script>
  <script src="room.js"></script>
</body>
</html>
